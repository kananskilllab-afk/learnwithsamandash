<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 32" preserveAspectRatio="none" style="display:none;">
  <defs>
    <!-- Seamless SVG Jagged Torn Paper Mask -->
    <mask id="torn-paper-edge-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <!-- Pure white reveals, black conceals -->
      <rect x="0" y="0" width="100%" height="100%" fill="#ffffff" />
    </mask>
  </defs>
</svg>
